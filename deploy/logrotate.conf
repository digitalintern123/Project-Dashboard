# Encalm Project Dashboard log rotation. Installed by setup-vps.sh as
# /etc/logrotate.d/encalm. Nginx's own logs are rotated by the nginx package.
#
# App logs (PM2 output: pino JSON lines) and the nightly backup log.
# copytruncate: PM2 keeps the files open, so rotate in place rather than
# moving them (a few lines written during the copy can be lost; acceptable).
/var/log/encalm/*.log {
    su encalm encalm
    daily
    rotate 30
    maxsize 100M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
}
