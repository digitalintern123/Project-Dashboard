# Encalm Project Dashboard: Nginx site template.
#
# deploy/setup-vps.sh renders this to /etc/nginx/sites-available/encalm-<env>.conf,
# replacing __DOMAIN__, __PORT__ (5000 production, 5001 staging) and __ENV__.
# Certificates come from Let's Encrypt (certbot, webroot /var/www/certbot).
#
# Security headers: the app (helmet) sets CSP, HSTS, X-Content-Type-Options,
# X-Frame-Options, Referrer-Policy and friends on everything it serves. Nginx
# drops any copies from the upstream and sets one consistent set itself, so no
# header is ever sent twice; the CSP stays the app's (it depends on config).

# Login attempts per client IP (the app has its own per-IP limit as well).
limit_req_zone $binary_remote_addr zone=encalm___ENV___login:10m rate=20r/m;

upstream encalm___ENV__ {
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt HTTP-01 challenges and renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... http2" works on every Ubuntu nginx (1.18-1.24); newer versions warn
    # that it is deprecated in favour of "http2 on;", which is harmless.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:encalm_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # JSON bodies are capped by the app (1 MB; 10 MB for portfolio imports).
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # One set of security headers on every response, including errors.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    access_log /var/log/nginx/encalm-__ENV__.access.log;
    error_log  /var/log/nginx/encalm-__ENV__.error.log warn;

    # Shared proxy settings.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Hashed build output: served straight from the live release, cached for a year.
    location /assets/ {
        alias /opt/encalm/__ENV__/current/dist/assets/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Photo uploads: up to 20 files of 10 MB each, re-encoded by the app.
    location ~ ^/api/projects/[^/]+/photos(/batch)?$ {
        client_max_body_size 210m;
        client_body_timeout 120s;
        proxy_request_buffering on;
        proxy_read_timeout 180s;
        proxy_pass http://encalm___ENV__;
    }

    location = /api/auth/login {
        limit_req zone=encalm___ENV___login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://encalm___ENV__;
    }

    location / {
        proxy_pass http://encalm___ENV__;
    }
}
