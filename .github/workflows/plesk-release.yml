name: Plesk release

# After CI passes on main, build that commit and publish the ready-to-run files
# to the "plesk-release" branch. Plesk on Windows pulls that branch and only
# runs `npm ci --omit=dev`: no build step on the server (which cannot run
# esbuild there, and has no Python/C++ tools). See PRODUCTION.md, section 15.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plesk-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish plesk-release
    # Manual runs build the current main; automatic runs only after a green CI on main.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build
        run: npm run build

      - name: Get the current plesk-release branch
        run: |
          if git ls-remote --exit-code --heads origin plesk-release >/dev/null; then
            git clone --quiet --depth 1 --branch plesk-release \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" release
          else
            mkdir release && git -C release init --quiet --initial-branch plesk-release
          fi

      - name: Assemble the release
        run: scripts/assemble-release.sh release "$SOURCE_SHA"

      - name: Smoke test with production dependencies only
        run: |
          cp -R release /tmp/smoke && cd /tmp/smoke
          npm ci --omit=dev --no-audit --no-fund
          data="$(mktemp -d)"
          DATA_DIR="$data" NODE_ENV=production \
            JWT_SECRET="$(openssl rand -base64 48)" SETTINGS_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            PORT="$data/app.sock" node server.cjs > "$data/app.log" 2>&1 &
          for _ in $(seq 60); do [ -S "$data/app.sock" ] && break; sleep 1; done
          curl -fsS --unix-socket "$data/app.sock" http://localhost/api/system/ready | grep -q '"ready"' \
            || { cat "$data/app.log"; exit 1; }
          curl -fsS --unix-socket "$data/app.sock" http://localhost/ | grep -q '<div id="root">'
          echo "Release starts and serves the app."

      - name: Publish
        working-directory: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed; plesk-release already matches ${SOURCE_SHA::8}."
            exit 0
          fi
          git commit --quiet -m "Release of ${SOURCE_SHA::8} from main" -m "Built by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push --quiet \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:plesk-release
          echo "### Published plesk-release for \`${SOURCE_SHA::8}\`" >> "$GITHUB_STEP_SUMMARY"
