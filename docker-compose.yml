services:
  encalm-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encalm-project-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_PORT=5000
      # Required: the server refuses to start without a strong secret (32+ chars).
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      - APP_BASE_URL=${APP_BASE_URL:-}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - DATA_DIR=/app/server/data
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Encalm Project Dashboard}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-notifications@encalm.com}
      - MS_GRAPH_TENANT_ID=${MS_GRAPH_TENANT_ID:-}
      - MS_GRAPH_CLIENT_ID=${MS_GRAPH_CLIENT_ID:-}
      - MS_GRAPH_CLIENT_SECRET=${MS_GRAPH_CLIENT_SECRET:-}
      - MS_GRAPH_SENDER_EMAIL=${MS_GRAPH_SENDER_EMAIL:-}
      - ALLOW_SYSTEM_RESET=${ALLOW_SYSTEM_RESET:-false}
    volumes:
      # Persistent SQLite database and uploaded site photos
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/system/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
